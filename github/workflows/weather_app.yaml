name: python fmi_api 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create .env
      run: |
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB}}">> .env
        echo "PATH_TO_DB=postgresql://${{"POSTGRES_USER}}:${{"POSTGRES_PASSWORD}}@postgres:5432/${{"POSTGRES_DB}}">> .env
        echo ".env file created with your variables "
    - name: Start services with docker-compose
      run: |
        docker-compose up -d
        
        sleep 10
        docker-compose ps

    - name: Set up python
      uses: action/setup-python@v5    
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: pip install uv
    - name: Sync dependencies from uv.lock
      run: uv sync

    - name: Run test
      run: uv run pytest working_project/tests/

    - name: Lint with ruff
      run: |
        uv pip install --system ruff
        ruff check .
    - name: Clean up
      run: docker-compose down